name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (browser, fake AI)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docmind
          POSTGRES_PASSWORD: docmind
          POSTGRES_DB: docmind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docmind -d docmind"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      # The stack (e2e/stack.mjs) expects the API repo next to the web repo, as in the local docmind folder.
      - uses: actions/checkout@v4
        with:
          path: docmind-web-service
      - uses: actions/checkout@v4
        with:
          repository: Eran2001/docmind-api-service
          ref: development
          path: docmind-api-service
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            docmind-api-service/package-lock.json
            docmind-web-service/package-lock.json
      - run: npm ci
        working-directory: docmind-api-service
      - run: npm ci
        working-directory: docmind-web-service
      - run: npx playwright install --with-deps chromium
        working-directory: docmind-web-service
      # Starts a fake AI service, the API, the worker and the web app on their own ports and database: no API keys, no cost.
      - run: npm run e2e
        working-directory: docmind-web-service
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            docmind-web-service/playwright-report
            docmind-web-service/test-results

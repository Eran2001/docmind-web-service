<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root,[data-theme="light"]{--bg:#ffffff;--fg:#0a0a0a;--fg2:#404040;--muted:#737373;--faint:#a3a3a3;--border:#e5e5e5;--border2:#d4d4d4;--surface:#f5f5f5;--surface2:#fafafa;--accent:#1d4ed8;--accent-bg:#eef3ff;--accent-bd:#c9d8fb;--btn:#0a0a0a;--btn-fg:#ffffff;--btn-hover:#262626;--ok:#15803d;--ok-bg:#effaf2;--warn:#a16207;--warn-bg:#fdf8e8;--err:#b91c1c;--err-bg:#fdf1f1;--hl:#fdf3c4;--overlay:rgba(10,10,10,.24);--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 32px -4px rgba(0,0,0,.12);color-scheme:light}
[data-theme="dark"]{--bg:#0a0a0a;--fg:#fafafa;--fg2:#d4d4d4;--muted:#a3a3a3;--faint:#737373;--border:#262626;--border2:#3a3a3a;--surface:#171717;--surface2:#111111;--accent:#7ea4ff;--accent-bg:#131d33;--accent-bd:#24365f;--btn:#fafafa;--btn-fg:#0a0a0a;--btn-hover:#e5e5e5;--ok:#5fc987;--ok-bg:#0f2117;--warn:#e0b04a;--warn-bg:#241c0b;--err:#f08080;--err-bg:#2a1111;--hl:#3b3413;--overlay:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.5),0 16px 40px -4px rgba(0,0,0,.7);color-scheme:dark}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Inter","Segoe UI",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
@keyframes dmspin{to{transform:rotate(360deg)}}
@keyframes dmpulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes dmin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
<script src="icons.js"></script>
</helmet>
<div data-screen-label="03 Collections" style="min-height:100vh;background:var(--bg);color:var(--fg)">
  <header style="height:56px;display:flex;align-items:center;gap:12px;padding:0 clamp(16px,3vw,24px);border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10">
    <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ onMenu }}" aria-label="Open menu" style="width:32px;height:32px;margin-left:-6px;display:inline-grid;place-items:center;border-radius:999px;border:0;background:transparent;color:var(--fg);cursor:pointer" style-hover="background:var(--surface)"><lucide-icon name="menu"></lucide-icon></button>
    </sc-if>
    <nav aria-label="Breadcrumb" style="flex:1;min-width:0;font-size:14px;font-weight:500">Collections</nav>
    <button onClick="{{ openDialog }}" style="height:34px;padding:0 14px 0 12px;border-radius:999px;border:0;background:var(--btn);color:var(--btn-fg);font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px" style-hover="background:var(--btn-hover)"><lucide-icon name="plus"></lucide-icon>New collection</button>
  </header>

  <div style="max-width:1120px;margin:0 auto;padding:32px clamp(16px,4vw,32px) 64px">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px">
      <div>
        <h1 style="font-size:24px;font-weight:600;letter-spacing:-0.025em;margin:0">Collections</h1>
        <p style="margin:4px 0 0;color:var(--muted)">Group related documents so answers only draw from the right sources.</p>
      </div>
      <sc-if value="{{ showSearch }}" hint-placeholder-val="{{ true }}">
        <label style="position:relative;display:flex;width:min(260px,100%)">
          <span style="position:absolute;left:14px;top:12px;color:var(--faint);display:flex"><lucide-icon name="search" size="14"></lucide-icon></span>
          <input value="{{ q }}" onChange="{{ onQ }}" placeholder="Filter collections" style="flex:1;min-width:0;height:38px;padding:0 14px 0 36px;border-radius:999px;background:var(--surface);border:1px solid transparent;outline:none;font-size:14px" style-focus="border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);background:var(--bg)">
        </label>
      </sc-if>
    </div>

    <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
      <div aria-busy="true" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px">
        <sc-for list="{{ skel }}" as="s" hint-placeholder-count="6">
          <div style="border:1px solid var(--border);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px;animation:dmpulse 1.4s ease-in-out infinite">
            <div style="width:32px;height:32px;border-radius:8px;background:var(--surface)"></div>
            <div style="height:14px;width:60%;border-radius:6px;background:var(--surface)"></div>
            <div style="height:10px;width:90%;border-radius:6px;background:var(--surface)"></div>
            <div style="height:10px;width:70%;border-radius:6px;background:var(--surface)"></div>
            <div style="height:10px;width:40%;border-radius:6px;background:var(--surface);margin-top:12px"></div>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
      <div style="border:1px dashed var(--border2);border-radius:12px;padding:72px 24px;display:flex;flex-direction:column;align-items:center;text-align:center">
        <div style="width:44px;height:44px;border-radius:999px;border:1px solid var(--border);display:grid;place-items:center;color:var(--muted)"><lucide-icon name="folder-plus" size="20"></lucide-icon></div>
        <h2 style="font-size:16px;font-weight:600;margin:16px 0 0;letter-spacing:-0.01em">No collections yet</h2>
        <p style="margin:6px 0 20px;color:var(--muted);max-width:340px">Create a collection, then upload documents to start asking questions.</p>
        <button onClick="{{ openDialog }}" style="height:38px;padding:0 16px 0 14px;border-radius:999px;border:0;background:var(--btn);color:var(--btn-fg);font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px" style-hover="background:var(--btn-hover)"><lucide-icon name="plus"></lucide-icon>New collection</button>
      </div>
    </sc-if>

    <sc-if value="{{ ready }}" hint-placeholder-val="{{ true }}">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px">
        <sc-for list="{{ items }}" as="c" hint-placeholder-count="6">
          <button onClick="{{ c.open }}" style="text-align:left;border:1px solid var(--border);border-radius:12px;padding:20px;background:var(--bg);cursor:pointer;display:flex;flex-direction:column;gap:0;min-height:176px;transition:border-color .15s" style-hover="border-color:var(--border2);background:var(--surface2)">
            <div style="display:flex;align-items:center;justify-content:space-between;width:100%">
              <div style="width:32px;height:32px;border-radius:8px;background:var(--surface);display:grid;place-items:center;color:var(--fg2)"><lucide-icon name="folder"></lucide-icon></div>
              <sc-if value="{{ c.isNew }}"><span style="height:20px;padding:0 8px;border-radius:999px;background:var(--accent-bg);color:var(--accent);font-size:11px;font-weight:500;display:inline-flex;align-items:center">New</span></sc-if>
            </div>
            <div style="font-size:15px;font-weight:500;letter-spacing:-0.01em;margin-top:16px">{{ c.name }}</div>
            <div style="font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{ c.desc }}</div>
            <div style="margin-top:auto;padding-top:16px;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)">
              <lucide-icon name="file-text" size="13"></lucide-icon><span>{{ c.docs }}</span><span style="color:var(--faint)">·</span><span>Updated {{ c.updated }}</span>
            </div>
          </button>
        </sc-for>
      </div>
      <sc-if value="{{ noMatch }}" hint-placeholder-val="{{ false }}">
        <p style="color:var(--muted);text-align:center;padding:48px 0">No collections match “{{ q }}”.</p>
      </sc-if>
    </sc-if>
  </div>

  <sc-if value="{{ dialog }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeDialog }}" style="position:fixed;inset:0;background:var(--overlay);z-index:60;display:grid;place-items:center;padding:16px">
      <div role="dialog" aria-modal="true" aria-labelledby="nc-title" onClick="{{ stop }}" style="width:min(460px,100%);background:var(--bg);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:24px;animation:dmin .16s ease-out">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
          <div>
            <h2 id="nc-title" style="font-size:17px;font-weight:600;letter-spacing:-0.015em;margin:0">New collection</h2>
            <p style="margin:4px 0 0;color:var(--muted);font-size:13px">You can upload documents right after creating it.</p>
          </div>
          <button onClick="{{ closeDialog }}" aria-label="Close" style="width:30px;height:30px;display:grid;place-items:center;border-radius:999px;border:0;background:transparent;color:var(--muted);cursor:pointer;margin:-4px -6px 0 0" style-hover="background:var(--surface);color:var(--fg)"><lucide-icon name="x"></lucide-icon></button>
        </div>
        <form onSubmit="{{ create }}" style="display:flex;flex-direction:column;gap:16px;margin-top:20px">
          <label style="display:flex;flex-direction:column;gap:6px">
            <span style="font-size:13px;font-weight:500">Name</span>
            <input autoFocus="{{ true }}" value="{{ name }}" onChange="{{ onName }}" placeholder="e.g. Sales Enablement" maxLength="60" style="height:40px;padding:0 16px;border-radius:999px;background:var(--surface);border:1px solid transparent;outline:none;font-size:14px" style-focus="border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);background:var(--bg)">
          </label>
          <label style="display:flex;flex-direction:column;gap:6px">
            <span style="font-size:13px;font-weight:500">Description <span style="color:var(--faint);font-weight:400">Optional</span></span>
            <textarea value="{{ desc }}" onChange="{{ onDesc }}" rows="3" placeholder="What's in this collection, and who is it for?" style="padding:10px 16px;border-radius:18px;background:var(--surface);border:1px solid transparent;outline:none;font-size:14px;resize:none;line-height:1.5" style-focus="border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);background:var(--bg)"></textarea>
          </label>
          <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:4px">
            <button type="button" onClick="{{ closeDialog }}" style="height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:var(--bg);font-size:14px;font-weight:500;cursor:pointer" style-hover="background:var(--surface)">Cancel</button>
            <button type="submit" disabled="{{ createDisabled }}" style="height:36px;padding:0 16px;border-radius:999px;border:0;background:var(--btn);color:var(--btn-fg);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;opacity:{{ createOpacity }};cursor:{{ createCursor }}">
              <sc-if value="{{ creating }}" hint-placeholder-val="{{ false }}"><span style="display:inline-flex;animation:dmspin .8s linear infinite"><lucide-icon name="loader-circle"></lucide-icon></span></sc-if>Create collection
            </button>
          </div>
        </form>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    created: [], dialog: false, name: '', desc: '', creating: false, q: '',
    base: [
      { name: 'Employee Handbook 2026', desc: 'Policies, benefits, leave and code of conduct for all full-time and part-time staff.', n: 14, updated: '2h ago' },
      { name: 'Q3 Board Reports', desc: 'Board decks, financial statements and minutes from the Q3 2026 board meeting.', n: 9, updated: 'yesterday' },
      { name: 'API Documentation', desc: 'Public REST API reference, SDK guides and changelog for platform v4.', n: 42, updated: '3 days ago' },
      { name: 'Vendor Contracts', desc: 'Signed MSAs, DPAs and order forms with active suppliers.', n: 27, updated: 'Sep 18' },
      { name: 'Security & Compliance', desc: 'SOC 2 Type II report, ISO 27001 policies and penetration test summaries.', n: 18, updated: 'Sep 12' },
      { name: 'Customer Support Playbooks', desc: 'Escalation paths, refund policy and response macros for tier 1–3 agents.', n: 11, updated: 'Aug 30' }
    ]
  };
  create = (e) => {
    e.preventDefault();
    const name = this.state.name.trim();
    if (!name || this.state.creating) return;
    this.setState({ creating: true });
    setTimeout(() => {
      this.setState(s => ({ creating: false, dialog: false, name: '', desc: '', created: [{ name, desc: s.desc.trim() || 'No description', n: 0, updated: 'just now', isNew: true }, ...s.created] }));
      this.props.toast && this.props.toast(`“${name}” is ready for documents.`, 'success', 'Collection created');
    }, 700);
  };
  renderVals() {
    const vs = this.props.viewState || 'populated', nav = this.props.nav || (() => {});
    const loading = vs === 'loading';
    const list = [...this.state.created, ...(vs === 'empty' ? [] : this.state.base)];
    const q = this.state.q.trim().toLowerCase();
    const items = list.filter(c => !q || c.name.toLowerCase().includes(q)).map(c => ({
      ...c, docs: c.n === 1 ? '1 document' : `${c.n} documents`, open: () => nav('documents')
    }));
    const dis = !this.state.name.trim() || this.state.creating;
    return {
      mobile: !!this.props.mobile, onMenu: this.props.onMenu,
      loading, empty: !loading && list.length === 0, ready: !loading && list.length > 0,
      showSearch: !loading && list.length > 0,
      noMatch: items.length === 0 && list.length > 0,
      skel: [1, 2, 3, 4, 5, 6], items, q: this.state.q,
      onQ: (e) => this.setState({ q: e.target.value }),
      dialog: this.state.dialog, name: this.state.name, desc: this.state.desc, creating: this.state.creating,
      openDialog: () => this.setState({ dialog: true }),
      closeDialog: () => this.setState({ dialog: false }),
      stop: (e) => e.stopPropagation(),
      onName: (e) => this.setState({ name: e.target.value }),
      onDesc: (e) => this.setState({ desc: e.target.value }),
      create: this.create,
      createDisabled: dis, createOpacity: dis ? 0.4 : 1, createCursor: dis ? 'not-allowed' : 'pointer'
    };
  }
}
</script>
</body>
</html>

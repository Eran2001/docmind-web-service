<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="a64cfcd6-26ad-4f82-9a29-686d70907aac"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">


<style>
:root,[data-theme="light"]{--bg:#ffffff;--fg:#0a0a0a;--fg2:#404040;--muted:#737373;--faint:#a3a3a3;--border:#e5e5e5;--border2:#d4d4d4;--surface:#f5f5f5;--surface2:#fafafa;--accent:#1d4ed8;--accent-bg:#eef3ff;--accent-bd:#c9d8fb;--btn:#0a0a0a;--btn-fg:#ffffff;--btn-hover:#262626;--ok:#15803d;--ok-bg:#effaf2;--warn:#a16207;--warn-bg:#fdf8e8;--err:#b91c1c;--err-bg:#fdf1f1;--hl:#fdf3c4;--overlay:rgba(10,10,10,.24);--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 32px -4px rgba(0,0,0,.12);color-scheme:light}
[data-theme="dark"]{--bg:#0a0a0a;--fg:#fafafa;--fg2:#d4d4d4;--muted:#a3a3a3;--faint:#737373;--border:#262626;--border2:#3a3a3a;--surface:#171717;--surface2:#111111;--accent:#7ea4ff;--accent-bg:#131d33;--accent-bd:#24365f;--btn:#fafafa;--btn-fg:#0a0a0a;--btn-hover:#e5e5e5;--ok:#5fc987;--ok-bg:#0f2117;--warn:#e0b04a;--warn-bg:#241c0b;--err:#f08080;--err-bg:#2a1111;--hl:#3b3413;--overlay:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.5),0 16px 40px -4px rgba(0,0,0,.7);color-scheme:dark}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Inter","Segoe UI",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
@keyframes dmspin{to{transform:rotate(360deg)}}
@keyframes dmblink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
@keyframes dmpulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes dmin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
<script src="d072fd38-5a18-4eed-8540-354599a4df91"></script>
</helmet>
<div data-theme="{{ theme }}" style="min-height:100vh;background:var(--bg);color:var(--fg)">
  <sc-if value="{{ r.landing }}" hint-placeholder-val="{{ false }}"><dc-import name="Landing" nav="{{ nav }}" hint-size="100%,100vh"></dc-import></sc-if>
  <sc-if value="{{ r.login }}" hint-placeholder-val="{{ false }}"><dc-import name="Auth" mode="login" nav="{{ nav }}" hint-size="100%,100vh"></dc-import></sc-if>
  <sc-if value="{{ r.register }}" hint-placeholder-val="{{ false }}"><dc-import name="Auth" mode="register" nav="{{ nav }}" hint-size="100%,100vh"></dc-import></sc-if>

  <sc-if value="{{ isApp }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;min-height:100vh">
      <sc-if value="{{ navOverlay }}" hint-placeholder-val="{{ false }}">
        <div sc-camel-on-click="{{ closeNav }}" style="position:fixed;inset:0;background:var(--overlay);z-index:39"></div>
      </sc-if>
      <aside style="width:240px;flex:none;top:0;left:0;height:100vh;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg);z-index:40;transition:transform .22s ease;position:{{ aside.pos }};transform:{{ aside.tf }};box-shadow:{{ aside.sh }}">
        <div style="height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 20px;flex:none">
          <div sc-camel-on-click="{{ goLanding }}" style="display:flex;align-items:center;gap:10px;cursor:pointer">
            <div style="width:22px;height:22px;border-radius:7px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:600">D</div>
            <span style="font-size:15px;font-weight:600;letter-spacing:-0.02em">DocMind</span>
          </div>
          <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
            <button sc-camel-on-click="{{ closeNav }}" aria-label="Close menu" style="width:32px;height:32px;display:inline-grid;place-items:center;border-radius:999px;border:0;background:transparent;color:var(--muted);cursor:pointer" style-hover="background:var(--surface);color:var(--fg)"><lucide-icon name="x"></lucide-icon></button>
          </sc-if>
        </div>
        <nav style="display:flex;flex-direction:column;gap:2px;padding:8px 12px">
          <sc-for list="{{ navItems }}" as="it" hint-placeholder-count="4">
            <button sc-camel-on-click="{{ it.go }}" aria-current="{{ it.current }}" style="display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;border:0;cursor:pointer;text-align:left;font-size:14px;background:{{ it.bg }};color:{{ it.color }};font-weight:{{ it.fw }}" style-hover="background:var(--surface);color:var(--fg)">
              <lucide-icon name="{{ it.icon }}"></lucide-icon>
              <span style="flex:1">{{ it.label }}</span>
              <sc-if value="{{ it.badge }}"><span style="height:18px;padding:0 7px;border-radius:999px;border:1px solid var(--border);font-size:11px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center">Admin</span></sc-if>
            </button>
          </sc-for>
        </nav>
        <div style="margin-top:auto;border-top:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:8px">
          <button sc-camel-on-click="{{ goSettings }}" style="display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:8px;border:0;cursor:pointer;text-align:left;background:{{ settingsBg }}" style-hover="background:var(--surface)">
            <div style="width:32px;height:32px;border-radius:999px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;font-size:12px;font-weight:500;flex:none">MC</div>
            <div style="min-width:0;flex:1">
              <div style="font-size:13px;font-weight:500;line-height:1.3">Maya Chen</div>
              <div style="font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3">maya.chen@acme.com</div>
            </div>
            <span style="color:var(--faint);display:flex"><lucide-icon name="settings" size="14"></lucide-icon></span>
          </button>
          <div style="display:flex;align-items:center;justify-content:space-between;padding:0 4px">
            <div role="radiogroup" aria-label="Theme" style="display:flex;gap:2px;padding:2px;border-radius:999px;background:var(--surface)">
              <button sc-camel-on-click="{{ setLight }}" aria-label="Light theme" style="width:28px;height:24px;display:grid;place-items:center;border-radius:999px;border:0;cursor:pointer;background:{{ tLight.bg }};color:{{ tLight.fg }};box-shadow:{{ tLight.sh }}"><lucide-icon name="sun" size="14"></lucide-icon></button>
              <button sc-camel-on-click="{{ setDark }}" aria-label="Dark theme" style="width:28px;height:24px;display:grid;place-items:center;border-radius:999px;border:0;cursor:pointer;background:{{ tDark.bg }};color:{{ tDark.fg }};box-shadow:{{ tDark.sh }}"><lucide-icon name="moon" size="14"></lucide-icon></button>
            </div>
            <button sc-camel-on-click="{{ signOut }}" style="display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px" style-hover="background:var(--surface);color:var(--fg)"><lucide-icon name="log-out" size="14"></lucide-icon>Sign out</button>
          </div>
        </div>
      </aside>
      <main style="flex:1;min-width:0;display:flex;flex-direction:column">
        <sc-if value="{{ r.collections }}" hint-placeholder-val="{{ false }}"><dc-import name="Collections" nav="{{ nav }}" toast="{{ toast }}" on-menu="{{ openNav }}" mobile="{{ mobile }}" view-state="{{ viewState }}" hint-size="100%,100vh"></dc-import></sc-if>
        <sc-if value="{{ r.documents }}" hint-placeholder-val="{{ false }}"><dc-import name="Documents" nav="{{ nav }}" toast="{{ toast }}" on-menu="{{ openNav }}" mobile="{{ mobile }}" view-state="{{ viewState }}" hint-size="100%,100vh"></dc-import></sc-if>
        <sc-if value="{{ r.chat }}" hint-placeholder-val="{{ false }}"><dc-import name="Chat" nav="{{ nav }}" toast="{{ toast }}" on-menu="{{ openNav }}" mobile="{{ mobile }}" view-state="{{ viewState }}" height="100vh" hint-size="100%,100vh"></dc-import></sc-if>
        <sc-if value="{{ r.evals }}" hint-placeholder-val="{{ false }}"><dc-import name="Evals" nav="{{ nav }}" toast="{{ toast }}" on-menu="{{ openNav }}" mobile="{{ mobile }}" view-state="{{ viewState }}" hint-size="100%,100vh"></dc-import></sc-if>
        <sc-if value="{{ r.eval }}" hint-placeholder-val="{{ false }}"><dc-import name="EvalDetail" nav="{{ nav }}" toast="{{ toast }}" on-menu="{{ openNav }}" mobile="{{ mobile }}" view-state="{{ viewState }}" hint-size="100%,100vh"></dc-import></sc-if>
        <sc-if value="{{ r.usage }}" hint-placeholder-val="{{ false }}"><dc-import name="Usage" nav="{{ nav }}" toast="{{ toast }}" on-menu="{{ openNav }}" mobile="{{ mobile }}" view-state="{{ viewState }}" hint-size="100%,100vh"></dc-import></sc-if>
        <sc-if value="{{ r.admin }}" hint-placeholder-val="{{ false }}"><dc-import name="Usage" admin="{{ true }}" nav="{{ nav }}" toast="{{ toast }}" on-menu="{{ openNav }}" mobile="{{ mobile }}" view-state="{{ viewState }}" hint-size="100%,100vh"></dc-import></sc-if>
        <sc-if value="{{ r.settings }}" hint-placeholder-val="{{ false }}"><dc-import name="Settings" nav="{{ nav }}" toast="{{ toast }}" on-menu="{{ openNav }}" mobile="{{ mobile }}" hint-size="100%,100vh"></dc-import></sc-if>
      </main>
    </div>
  </sc-if>

  <div aria-live="polite" style="position:fixed;right:20px;bottom:20px;z-index:100;display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100vw - 40px))">
    <sc-for list="{{ toasts }}" as="t" hint-placeholder-count="0">
      <div role="status" style="display:flex;gap:10px;align-items:flex-start;padding:12px 10px 12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--bg);box-shadow:var(--shadow);font-size:13px;animation:dmin .18s ease-out">
        <span style="color:{{ t.color }};margin-top:1px;display:flex"><lucide-icon name="{{ t.icon }}"></lucide-icon></span>
        <div style="flex:1;min-width:0">
          <div style="font-weight:500;line-height:1.4">{{ t.title }}</div>
          <div style="color:var(--muted);line-height:1.45;margin-top:2px">{{ t.msg }}</div>
        </div>
        <button sc-camel-on-click="{{ t.close }}" aria-label="Dismiss" style="width:24px;height:24px;display:grid;place-items:center;border-radius:999px;border:0;background:transparent;color:var(--faint);cursor:pointer" style-hover="background:var(--surface);color:var(--fg)"><lucide-icon name="x" size="14"></lucide-icon></button>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;screen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;landing&quot;,&quot;login&quot;,&quot;register&quot;,&quot;collections&quot;,&quot;documents&quot;,&quot;chat&quot;,&quot;evals&quot;,&quot;eval&quot;,&quot;usage&quot;,&quot;admin&quot;,&quot;settings&quot;],&quot;default&quot;:&quot;landing&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;viewState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;populated&quot;,&quot;loading&quot;,&quot;empty&quot;],&quot;default&quot;:&quot;populated&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prototype&quot;}}">
class Component extends DCLogic {
  state = { route: null, theme: null, navOpen: false, w: window.innerWidth, toasts: [] };
  componentDidMount() {
    this.onResize = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.onResize);
    const q = new URLSearchParams(location.search);
    this.urlLocked = q.has('screen') || q.has('theme');
    if (this.urlLocked) this.setState({ route: q.get('screen'), theme: q.get('theme') });
    else try {
      const s = JSON.parse(localStorage.getItem('docmind.proto') || 'null');
      if (s) this.setState({ route: s.route || null, theme: s.theme || null });
    } catch (e) {}
    this.paintBg();
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }
  componentDidUpdate(pp) {
    if (pp.screen !== this.props.screen && this.props.screen) this.go(this.props.screen);
    if (pp.theme !== this.props.theme && this.props.theme) this.setTheme(this.props.theme);
    this.paintBg();
  }
  paintBg() { document.documentElement.style.background = this.theme() === 'dark' ? '#0a0a0a' : '#ffffff'; }
  route() { return this.state.route || this.props.screen || 'landing'; }
  theme() { return this.state.theme || this.props.theme || 'light'; }
  persist() { if (this.urlLocked) return; try { localStorage.setItem('docmind.proto', JSON.stringify({ route: this.route(), theme: this.theme() })); } catch (e) {} }
  go = (r) => { this.setState({ route: r, navOpen: false }, () => this.persist()); window.scrollTo(0, 0); };
  setTheme = (t) => this.setState({ theme: t }, () => this.persist());
  toast = (msg, kind = 'info', title) => {
    const id = Math.random().toString(36).slice(2);
    const titles = { error: 'Something went wrong', success: 'Done', info: 'Heads up' };
    this.setState(s => ({ toasts: [...s.toasts.slice(-2), { id, msg, kind, title: title || titles[kind] }] }));
    setTimeout(() => this.dismiss(id), 5000);
  };
  dismiss = (id) => this.setState(s => ({ toasts: s.toasts.filter(t => t.id !== id) }));
  renderVals() {
    const route = this.route(), theme = this.theme(), mobile = this.state.w < 768, open = this.state.navOpen;
    const r = {};
    ['landing', 'login', 'register', 'collections', 'documents', 'chat', 'evals', 'eval', 'usage', 'admin', 'settings'].forEach(k => (r[k] = route === k));
    const isApp = !(r.landing || r.login || r.register);
    const section = { collections: 'collections', documents: 'collections', chat: 'collections', evals: 'evals', eval: 'evals', usage: 'usage', admin: 'admin' }[route];
    const navItems = [['collections', 'Collections', 'folder'], ['evals', 'Evals', 'flask-conical'], ['usage', 'Usage', 'chart-line'], ['admin', 'Team usage', 'shield']].map(([k, label, icon]) => {
      const a = section === k;
      return { label, icon, badge: k === 'admin', go: () => this.go(k), bg: a ? 'var(--surface)' : 'transparent', color: a ? 'var(--fg)' : 'var(--muted)', fw: a ? 500 : 400, current: a ? 'page' : undefined };
    });
    const kinds = { error: ['circle-alert', 'var(--err)'], success: ['circle-check', 'var(--ok)'], info: ['info', 'var(--fg)'] };
    const seg = (on) => ({ bg: on ? 'var(--bg)' : 'transparent', fg: on ? 'var(--fg)' : 'var(--muted)', sh: on ? '0 1px 2px rgba(0,0,0,.08)' : 'none' });
    const vs = this.props.viewState || 'populated';
    return {
      theme, r, isApp, mobile, navItems,
      navOverlay: mobile && open,
      aside: mobile ? { pos: 'fixed', tf: open ? 'translateX(0)' : 'translateX(-100%)', sh: open ? 'var(--shadow)' : 'none' } : { pos: 'sticky', tf: 'none', sh: 'none' },
      settingsBg: r.settings ? 'var(--surface)' : 'transparent',
      tLight: seg(theme === 'light'), tDark: seg(theme === 'dark'),
      setLight: () => this.setTheme('light'), setDark: () => this.setTheme('dark'),
      nav: this.go, toast: this.toast, viewState: vs,
      openNav: () => this.setState({ navOpen: true }), closeNav: () => this.setState({ navOpen: false }),
      goLanding: () => this.go('landing'), goSettings: () => this.go('settings'),
      signOut: () => this.go('login'),
      toasts: this.state.toasts.map(t => ({ ...t, icon: kinds[t.kind][0], color: kinds[t.kind][1], close: () => this.dismiss(t.id) }))
    };
  }
}
</script>


</body></html>

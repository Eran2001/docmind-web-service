<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root,[data-theme="light"]{--bg:#ffffff;--fg:#0a0a0a;--fg2:#404040;--muted:#737373;--faint:#a3a3a3;--border:#e5e5e5;--border2:#d4d4d4;--surface:#f5f5f5;--surface2:#fafafa;--accent:#1d4ed8;--accent-bg:#eef3ff;--accent-bd:#c9d8fb;--btn:#0a0a0a;--btn-fg:#ffffff;--btn-hover:#262626;--ok:#15803d;--ok-bg:#effaf2;--warn:#a16207;--warn-bg:#fdf8e8;--err:#b91c1c;--err-bg:#fdf1f1;--hl:#fdf3c4;--overlay:rgba(10,10,10,.24);--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 32px -4px rgba(0,0,0,.12);color-scheme:light}
[data-theme="dark"]{--bg:#0a0a0a;--fg:#fafafa;--fg2:#d4d4d4;--muted:#a3a3a3;--faint:#737373;--border:#262626;--border2:#3a3a3a;--surface:#171717;--surface2:#111111;--accent:#7ea4ff;--accent-bg:#131d33;--accent-bd:#24365f;--btn:#fafafa;--btn-fg:#0a0a0a;--btn-hover:#e5e5e5;--ok:#5fc987;--ok-bg:#0f2117;--warn:#e0b04a;--warn-bg:#241c0b;--err:#f08080;--err-bg:#2a1111;--hl:#3b3413;--overlay:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.5),0 16px 40px -4px rgba(0,0,0,.7);color-scheme:dark}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Inter","Segoe UI",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
@keyframes dmspin{to{transform:rotate(360deg)}}
</style>
<script src="icons.js"></script>
</helmet>
<div data-screen-label="02 Auth" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 16px;background:var(--bg);color:var(--fg)">
  <button onClick="{{ goHome }}" aria-label="DocMind home" style="display:flex;align-items:center;gap:10px;border:0;background:transparent;cursor:pointer;padding:0">
    <div style="width:28px;height:28px;border-radius:8px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:14px;font-weight:600">D</div>
    <span style="font-size:17px;font-weight:600;letter-spacing:-0.02em">DocMind</span>
  </button>
  <div style="width:100%;max-width:400px;margin-top:28px;border:1px solid var(--border);border-radius:14px;padding:clamp(24px,6vw,32px);background:var(--bg)">
    <sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">
      <h1 style="font-size:20px;font-weight:600;letter-spacing:-0.02em;margin:0">Sign in</h1>
      <p style="margin:4px 0 0;color:var(--muted)">Welcome back. Enter your work email to continue.</p>
    </sc-if>
    <sc-if value="{{ isRegister }}" hint-placeholder-val="{{ false }}">
      <h1 style="font-size:20px;font-weight:600;letter-spacing:-0.02em;margin:0">Create your account</h1>
      <p style="margin:4px 0 0;color:var(--muted)">Start with a free workspace. No credit card required.</p>
    </sc-if>
    <form onSubmit="{{ submit }}" noValidate="{{ true }}" style="display:flex;flex-direction:column;gap:16px;margin-top:24px">
      <sc-if value="{{ isRegister }}" hint-placeholder-val="{{ false }}">
        <label style="display:flex;flex-direction:column;gap:6px">
          <span style="font-size:13px;font-weight:500">Full name</span>
          <input value="{{ name }}" onChange="{{ onName }}" placeholder="Maya Chen" autocomplete="name" style="height:40px;padding:0 16px;border-radius:999px;background:var(--surface);outline:none;font-size:14px;border:1px solid {{ b.name }}" style-focus="border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);background:var(--bg)">
          <sc-if value="{{ errors.name }}"><span style="font-size:12px;color:var(--err);display:flex;gap:6px;align-items:center;padding-left:14px"><lucide-icon name="circle-alert" size="13"></lucide-icon>{{ errors.name }}</span></sc-if>
        </label>
      </sc-if>
      <label style="display:flex;flex-direction:column;gap:6px">
        <span style="font-size:13px;font-weight:500">Work email</span>
        <input type="email" value="{{ email }}" onChange="{{ onEmail }}" placeholder="you@company.com" autocomplete="email" style="height:40px;padding:0 16px;border-radius:999px;background:var(--surface);outline:none;font-size:14px;border:1px solid {{ b.email }}" style-focus="border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);background:var(--bg)">
        <sc-if value="{{ errors.email }}"><span style="font-size:12px;color:var(--err);display:flex;gap:6px;align-items:center;padding-left:14px"><lucide-icon name="circle-alert" size="13"></lucide-icon>{{ errors.email }}</span></sc-if>
      </label>
      <label style="display:flex;flex-direction:column;gap:6px">
        <span style="display:flex;justify-content:space-between;align-items:baseline">
          <span style="font-size:13px;font-weight:500">Password</span>
          <sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}"><a href="#" style="font-size:13px">Forgot password?</a></sc-if>
        </span>
        <span style="position:relative;display:flex">
          <input type="{{ pwType }}" value="{{ password }}" onChange="{{ onPassword }}" placeholder="{{ pwPlaceholder }}" autocomplete="current-password" style="flex:1;min-width:0;height:40px;padding:0 44px 0 16px;border-radius:999px;background:var(--surface);outline:none;font-size:14px;border:1px solid {{ b.password }}" style-focus="border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);background:var(--bg)">
          <button type="button" onClick="{{ togglePw }}" aria-label="Show password" style="position:absolute;right:6px;top:6px;width:28px;height:28px;display:grid;place-items:center;border-radius:999px;border:0;background:transparent;color:var(--muted);cursor:pointer" style-hover="color:var(--fg)"><lucide-icon name="{{ pwIcon }}"></lucide-icon></button>
        </span>
        <sc-if value="{{ errors.password }}"><span style="font-size:12px;color:var(--err);display:flex;gap:6px;align-items:center;padding-left:14px"><lucide-icon name="circle-alert" size="13"></lucide-icon>{{ errors.password }}</span></sc-if>
        <sc-if value="{{ showHint }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:var(--muted);padding-left:14px">At least 8 characters.</span></sc-if>
      </label>
      <button type="submit" disabled="{{ loading }}" style="height:42px;border-radius:999px;border:0;background:var(--btn);color:var(--btn-fg);font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;opacity:{{ btnOpacity }}" style-hover="background:var(--btn-hover)">
        <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}"><span style="display:inline-flex;animation:dmspin .8s linear infinite"><lucide-icon name="loader-circle"></lucide-icon></span></sc-if>
        {{ submitLabel }}
      </button>
    </form>
    <sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--faint);font-size:12px"><span style="flex:1;height:1px;background:var(--border)"></span>or<span style="flex:1;height:1px;background:var(--border)"></span></div>
      <button type="button" style="width:100%;height:42px;border-radius:999px;border:1px solid var(--border);background:var(--bg);font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px" style-hover="background:var(--surface)"><lucide-icon name="key-round"></lucide-icon>Continue with SSO</button>
    </sc-if>
  </div>
  <p style="margin:20px 0 0;color:var(--muted);font-size:14px">
    <sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">No account? <a href="#" onClick="{{ switchMode }}">Create one</a></sc-if>
    <sc-if value="{{ isRegister }}" hint-placeholder-val="{{ false }}">Already have an account? <a href="#" onClick="{{ switchMode }}">Sign in</a></sc-if>
  </p>
  <sc-if value="{{ isRegister }}" hint-placeholder-val="{{ false }}">
    <p style="margin:8px 0 0;color:var(--faint);font-size:12px;text-align:center;max-width:320px">By creating an account you agree to the <a href="#" style="color:var(--muted);text-decoration:underline">Terms</a> and <a href="#" style="color:var(--muted);text-decoration:underline">Privacy Policy</a>.</p>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;login&quot;,&quot;register&quot;],&quot;default&quot;:&quot;login&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;nav&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(route: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { name: '', email: '', password: '', errors: {}, loading: false, showPw: false };
  componentDidUpdate(pp) { if (pp.mode !== this.props.mode) this.setState({ errors: {}, loading: false }); }
  isReg() { return this.props.mode === 'register'; }
  submit = (e) => {
    e.preventDefault();
    const { name, email, password } = this.state, reg = this.isReg(), errors = {};
    if (reg && !name.trim()) errors.name = 'Enter your full name';
    if (!email.trim()) errors.email = 'Enter your email address';
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errors.email = 'Enter a valid email, like name@company.com';
    if (!password) errors.password = reg ? 'Create a password' : 'Enter your password';
    else if (reg && password.length < 8) errors.password = 'Password must be at least 8 characters';
    this.setState({ errors });
    if (Object.keys(errors).length) return;
    this.setState({ loading: true });
    setTimeout(() => { this.setState({ loading: false }); this.props.nav && this.props.nav('collections'); }, 900);
  };
  field = (k) => (e) => { const v = e.target.value; this.setState(s => ({ [k]: v, errors: { ...s.errors, [k]: undefined } })); };
  renderVals() {
    const reg = this.isReg(), er = this.state.errors, L = this.state.loading;
    const bd = (k) => (er[k] ? 'var(--err)' : 'transparent');
    return {
      isLogin: !reg, isRegister: reg,
      name: this.state.name, email: this.state.email, password: this.state.password,
      onName: this.field('name'), onEmail: this.field('email'), onPassword: this.field('password'),
      errors: er, b: { name: bd('name'), email: bd('email'), password: bd('password') },
      pwType: this.state.showPw ? 'text' : 'password', pwIcon: this.state.showPw ? 'eye-off' : 'eye',
      pwPlaceholder: reg ? 'Create a password' : 'Enter your password',
      togglePw: () => this.setState(s => ({ showPw: !s.showPw })),
      showHint: reg && !er.password,
      loading: L, btnOpacity: L ? 0.6 : 1,
      submitLabel: L ? (reg ? 'Creating account…' : 'Signing in…') : (reg ? 'Create account' : 'Sign in'),
      submit: this.submit,
      switchMode: (e) => { e.preventDefault(); this.props.nav && this.props.nav(reg ? 'login' : 'register'); },
      goHome: () => this.props.nav && this.props.nav('landing')
    };
  }
}
</script>
</body>
</html>

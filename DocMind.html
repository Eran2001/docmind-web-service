  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    const templateEl = document.querySelector('script[type="__bundler/template"]');

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      : '*';

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);

    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {

        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }

        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"a64cfcd6-26ad-4f82-9a29-686d70907aac\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\n\n<style>\n:root,[data-theme=\"light\"]{--bg:#ffffff;--fg:#0a0a0a;--fg2:#404040;--muted:#737373;--faint:#a3a3a3;--border:#e5e5e5;--border2:#d4d4d4;--surface:#f5f5f5;--surface2:#fafafa;--accent:#1d4ed8;--accent-bg:#eef3ff;--accent-bd:#c9d8fb;--btn:#0a0a0a;--btn-fg:#ffffff;--btn-hover:#262626;--ok:#15803d;--ok-bg:#effaf2;--warn:#a16207;--warn-bg:#fdf8e8;--err:#b91c1c;--err-bg:#fdf1f1;--hl:#fdf3c4;--overlay:rgba(10,10,10,.24);--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 32px -4px rgba(0,0,0,.12);color-scheme:light}\n[data-theme=\"dark\"]{--bg:#0a0a0a;--fg:#fafafa;--fg2:#d4d4d4;--muted:#a3a3a3;--faint:#737373;--border:#262626;--border2:#3a3a3a;--surface:#171717;--surface2:#111111;--accent:#7ea4ff;--accent-bg:#131d33;--accent-bd:#24365f;--btn:#fafafa;--btn-fg:#0a0a0a;--btn-hover:#e5e5e5;--ok:#5fc987;--ok-bg:#0f2117;--warn:#e0b04a;--warn-bg:#241c0b;--err:#f08080;--err-bg:#2a1111;--hl:#3b3413;--overlay:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.5),0 16px 40px -4px rgba(0,0,0,.7);color-scheme:dark}\nhtml,body{margin:0;padding:0}\nbody{background:var(--bg);color:var(--fg);font-family:ui-sans-serif,system-ui,-apple-system,\"SF Pro Text\",\"Inter\",\"Segoe UI\",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}\n*,*::before,*::after{box-sizing:border-box}\nbutton,input,textarea,select{font:inherit;color:inherit}\na{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}\n@keyframes dmspin{to{transform:rotate(360deg)}}\n@keyframes dmblink{0%,50%{opacity:1}50.01%,100%{opacity:0}}\n@keyframes dmpulse{0%,100%{opacity:1}50%{opacity:.45}}\n@keyframes dmin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n<\u002Fstyle>\n<script src=\"d072fd38-5a18-4eed-8540-354599a4df91\"><\u002Fscript>\n<\u002Fhelmet>\n<div data-theme=\"{{ theme }}\" style=\"min-height:100vh;background:var(--bg);color:var(--fg)\">\n  <sc-if value=\"{{ r.landing }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"Landing\" nav=\"{{ nav }}\" hint-size=\"100%,100vh\"><\u002Fdc-import><\u002Fsc-if>\n  <sc-if value=\"{{ r.login }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"Auth\" mode=\"login\" nav=\"{{ nav }}\" hint-size=\"100%,100vh\"><\u002Fdc-import><\u002Fsc-if>\n  <sc-if value=\"{{ r.register }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"Auth\" mode=\"register\" nav=\"{{ nav }}\" hint-size=\"100%,100vh\"><\u002Fdc-import><\u002Fsc-if>\n\n  <sc-if value=\"{{ isApp }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:flex;min-height:100vh\">\n      <sc-if value=\"{{ navOverlay }}\" hint-placeholder-val=\"{{ false }}\">\n        <div sc-camel-on-click=\"{{ closeNav }}\" style=\"position:fixed;inset:0;background:var(--overlay);z-index:39\"><\u002Fdiv>\n      <\u002Fsc-if>\n      <aside style=\"width:240px;flex:none;top:0;left:0;height:100vh;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg);z-index:40;transition:transform .22s ease;position:{{ aside.pos }};transform:{{ aside.tf }};box-shadow:{{ aside.sh }}\">\n        <div style=\"height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 20px;flex:none\">\n          <div sc-camel-on-click=\"{{ goLanding }}\" style=\"display:flex;align-items:center;gap:10px;cursor:pointer\">\n            <div style=\"width:22px;height:22px;border-radius:7px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:600\">D<\u002Fdiv>\n            <span style=\"font-size:15px;font-weight:600;letter-spacing:-0.02em\">DocMind<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ mobile }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ closeNav }}\" aria-label=\"Close menu\" style=\"width:32px;height:32px;display:inline-grid;place-items:center;border-radius:999px;border:0;background:transparent;color:var(--muted);cursor:pointer\" style-hover=\"background:var(--surface);color:var(--fg)\"><lucide-icon name=\"x\"><\u002Flucide-icon><\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <nav style=\"display:flex;flex-direction:column;gap:2px;padding:8px 12px\">\n          <sc-for list=\"{{ navItems }}\" as=\"it\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ it.go }}\" aria-current=\"{{ it.current }}\" style=\"display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;border:0;cursor:pointer;text-align:left;font-size:14px;background:{{ it.bg }};color:{{ it.color }};font-weight:{{ it.fw }}\" style-hover=\"background:var(--surface);color:var(--fg)\">\n              <lucide-icon name=\"{{ it.icon }}\"><\u002Flucide-icon>\n              <span style=\"flex:1\">{{ it.label }}<\u002Fspan>\n              <sc-if value=\"{{ it.badge }}\"><span style=\"height:18px;padding:0 7px;border-radius:999px;border:1px solid var(--border);font-size:11px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center\">Admin<\u002Fspan><\u002Fsc-if>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fnav>\n        <div style=\"margin-top:auto;border-top:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:8px\">\n          <button sc-camel-on-click=\"{{ goSettings }}\" style=\"display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:8px;border:0;cursor:pointer;text-align:left;background:{{ settingsBg }}\" style-hover=\"background:var(--surface)\">\n            <div style=\"width:32px;height:32px;border-radius:999px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;font-size:12px;font-weight:500;flex:none\">MC<\u002Fdiv>\n            <div style=\"min-width:0;flex:1\">\n              <div style=\"font-size:13px;font-weight:500;line-height:1.3\">Maya Chen<\u002Fdiv>\n              <div style=\"font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3\">maya.chen@acme.com<\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"color:var(--faint);display:flex\"><lucide-icon name=\"settings\" size=\"14\"><\u002Flucide-icon><\u002Fspan>\n          <\u002Fbutton>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;padding:0 4px\">\n            <div role=\"radiogroup\" aria-label=\"Theme\" style=\"display:flex;gap:2px;padding:2px;border-radius:999px;background:var(--surface)\">\n              <button sc-camel-on-click=\"{{ setLight }}\" aria-label=\"Light theme\" style=\"width:28px;height:24px;display:grid;place-items:center;border-radius:999px;border:0;cursor:pointer;background:{{ tLight.bg }};color:{{ tLight.fg }};box-shadow:{{ tLight.sh }}\"><lucide-icon name=\"sun\" size=\"14\"><\u002Flucide-icon><\u002Fbutton>\n              <button sc-camel-on-click=\"{{ setDark }}\" aria-label=\"Dark theme\" style=\"width:28px;height:24px;display:grid;place-items:center;border-radius:999px;border:0;cursor:pointer;background:{{ tDark.bg }};color:{{ tDark.fg }};box-shadow:{{ tDark.sh }}\"><lucide-icon name=\"moon\" size=\"14\"><\u002Flucide-icon><\u002Fbutton>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ signOut }}\" style=\"display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px\" style-hover=\"background:var(--surface);color:var(--fg)\"><lucide-icon name=\"log-out\" size=\"14\"><\u002Flucide-icon>Sign out<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Faside>\n      <main style=\"flex:1;min-width:0;display:flex;flex-direction:column\">\n        <sc-if value=\"{{ r.collections }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"Collections\" nav=\"{{ nav }}\" toast=\"{{ toast }}\" on-menu=\"{{ openNav }}\" mobile=\"{{ mobile }}\" view-state=\"{{ viewState }}\" hint-size=\"100%,100vh\"><\u002Fdc-import><\u002Fsc-if>\n        <sc-if value=\"{{ r.documents }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"Documents\" nav=\"{{ nav }}\" toast=\"{{ toast }}\" on-menu=\"{{ openNav }}\" mobile=\"{{ mobile }}\" view-state=\"{{ viewState }}\" hint-size=\"100%,100vh\"><\u002Fdc-import><\u002Fsc-if>\n        <sc-if value=\"{{ r.chat }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"Chat\" nav=\"{{ nav }}\" toast=\"{{ toast }}\" on-menu=\"{{ openNav }}\" mobile=\"{{ mobile }}\" view-state=\"{{ viewState }}\" height=\"100vh\" hint-size=\"100%,100vh\"><\u002Fdc-import><\u002Fsc-if>\n        <sc-if value=\"{{ r.evals }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"Evals\" nav=\"{{ nav }}\" toast=\"{{ toast }}\" on-menu=\"{{ openNav }}\" mobile=\"{{ mobile }}\" view-state=\"{{ viewState }}\" hint-size=\"100%,100vh\"><\u002Fdc-import><\u002Fsc-if>\n        <sc-if value=\"{{ r.eval }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"EvalDetail\" nav=\"{{ nav }}\" toast=\"{{ toast }}\" on-menu=\"{{ openNav }}\" mobile=\"{{ mobile }}\" view-state=\"{{ viewState }}\" hint-size=\"100%,100vh\"><\u002Fdc-import><\u002Fsc-if>\n        <sc-if value=\"{{ r.usage }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"Usage\" nav=\"{{ nav }}\" toast=\"{{ toast }}\" on-menu=\"{{ openNav }}\" mobile=\"{{ mobile }}\" view-state=\"{{ viewState }}\" hint-size=\"100%,100vh\"><\u002Fdc-import><\u002Fsc-if>\n        <sc-if value=\"{{ r.admin }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"Usage\" admin=\"{{ true }}\" nav=\"{{ nav }}\" toast=\"{{ toast }}\" on-menu=\"{{ openNav }}\" mobile=\"{{ mobile }}\" view-state=\"{{ viewState }}\" hint-size=\"100%,100vh\"><\u002Fdc-import><\u002Fsc-if>\n        <sc-if value=\"{{ r.settings }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"Settings\" nav=\"{{ nav }}\" toast=\"{{ toast }}\" on-menu=\"{{ openNav }}\" mobile=\"{{ mobile }}\" hint-size=\"100%,100vh\"><\u002Fdc-import><\u002Fsc-if>\n      <\u002Fmain>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div aria-live=\"polite\" style=\"position:fixed;right:20px;bottom:20px;z-index:100;display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100vw - 40px))\">\n    <sc-for list=\"{{ toasts }}\" as=\"t\" hint-placeholder-count=\"0\">\n      <div role=\"status\" style=\"display:flex;gap:10px;align-items:flex-start;padding:12px 10px 12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--bg);box-shadow:var(--shadow);font-size:13px;animation:dmin .18s ease-out\">\n        <span style=\"color:{{ t.color }};margin-top:1px;display:flex\"><lucide-icon name=\"{{ t.icon }}\"><\u002Flucide-icon><\u002Fspan>\n        <div style=\"flex:1;min-width:0\">\n          <div style=\"font-weight:500;line-height:1.4\">{{ t.title }}<\u002Fdiv>\n          <div style=\"color:var(--muted);line-height:1.45;margin-top:2px\">{{ t.msg }}<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ t.close }}\" aria-label=\"Dismiss\" style=\"width:24px;height:24px;display:grid;place-items:center;border-radius:999px;border:0;background:transparent;color:var(--faint);cursor:pointer\" style-hover=\"background:var(--surface);color:var(--fg)\"><lucide-icon name=\"x\" size=\"14\"><\u002Flucide-icon><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;screen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;landing&quot;,&quot;login&quot;,&quot;register&quot;,&quot;collections&quot;,&quot;documents&quot;,&quot;chat&quot;,&quot;evals&quot;,&quot;eval&quot;,&quot;usage&quot;,&quot;admin&quot;,&quot;settings&quot;],&quot;default&quot;:&quot;landing&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;viewState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;populated&quot;,&quot;loading&quot;,&quot;empty&quot;],&quot;default&quot;:&quot;populated&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prototype&quot;}}\">\nclass Component extends DCLogic {\n  state = { route: null, theme: null, navOpen: false, w: window.innerWidth, toasts: [] };\n  componentDidMount() {\n    this.onResize = () => this.setState({ w: window.innerWidth });\n    window.addEventListener('resize', this.onResize);\n    const q = new URLSearchParams(location.search);\n    this.urlLocked = q.has('screen') || q.has('theme');\n    if (this.urlLocked) this.setState({ route: q.get('screen'), theme: q.get('theme') });\n    else try {\n      const s = JSON.parse(localStorage.getItem('docmind.proto') || 'null');\n      if (s) this.setState({ route: s.route || null, theme: s.theme || null });\n    } catch (e) {}\n    this.paintBg();\n  }\n  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }\n  componentDidUpdate(pp) {\n    if (pp.screen !== this.props.screen && this.props.screen) this.go(this.props.screen);\n    if (pp.theme !== this.props.theme && this.props.theme) this.setTheme(this.props.theme);\n    this.paintBg();\n  }\n  paintBg() { document.documentElement.style.background = this.theme() === 'dark' ? '#0a0a0a' : '#ffffff'; }\n  route() { return this.state.route || this.props.screen || 'landing'; }\n  theme() { return this.state.theme || this.props.theme || 'light'; }\n  persist() { if (this.urlLocked) return; try { localStorage.setItem('docmind.proto', JSON.stringify({ route: this.route(), theme: this.theme() })); } catch (e) {} }\n  go = (r) => { this.setState({ route: r, navOpen: false }, () => this.persist()); window.scrollTo(0, 0); };\n  setTheme = (t) => this.setState({ theme: t }, () => this.persist());\n  toast = (msg, kind = 'info', title) => {\n    const id = Math.random().toString(36).slice(2);\n    const titles = { error: 'Something went wrong', success: 'Done', info: 'Heads up' };\n    this.setState(s => ({ toasts: [...s.toasts.slice(-2), { id, msg, kind, title: title || titles[kind] }] }));\n    setTimeout(() => this.dismiss(id), 5000);\n  };\n  dismiss = (id) => this.setState(s => ({ toasts: s.toasts.filter(t => t.id !== id) }));\n  renderVals() {\n    const route = this.route(), theme = this.theme(), mobile = this.state.w < 768, open = this.state.navOpen;\n    const r = {};\n    ['landing', 'login', 'register', 'collections', 'documents', 'chat', 'evals', 'eval', 'usage', 'admin', 'settings'].forEach(k => (r[k] = route === k));\n    const isApp = !(r.landing || r.login || r.register);\n    const section = { collections: 'collections', documents: 'collections', chat: 'collections', evals: 'evals', eval: 'evals', usage: 'usage', admin: 'admin' }[route];\n    const navItems = [['collections', 'Collections', 'folder'], ['evals', 'Evals', 'flask-conical'], ['usage', 'Usage', 'chart-line'], ['admin', 'Team usage', 'shield']].map(([k, label, icon]) => {\n      const a = section === k;\n      return { label, icon, badge: k === 'admin', go: () => this.go(k), bg: a ? 'var(--surface)' : 'transparent', color: a ? 'var(--fg)' : 'var(--muted)', fw: a ? 500 : 400, current: a ? 'page' : undefined };\n    });\n    const kinds = { error: ['circle-alert', 'var(--err)'], success: ['circle-check', 'var(--ok)'], info: ['info', 'var(--fg)'] };\n    const seg = (on) => ({ bg: on ? 'var(--bg)' : 'transparent', fg: on ? 'var(--fg)' : 'var(--muted)', sh: on ? '0 1px 2px rgba(0,0,0,.08)' : 'none' });\n    const vs = this.props.viewState || 'populated';\n    return {\n      theme, r, isApp, mobile, navItems,\n      navOverlay: mobile && open,\n      aside: mobile ? { pos: 'fixed', tf: open ? 'translateX(0)' : 'translateX(-100%)', sh: open ? 'var(--shadow)' : 'none' } : { pos: 'sticky', tf: 'none', sh: 'none' },\n      settingsBg: r.settings ? 'var(--surface)' : 'transparent',\n      tLight: seg(theme === 'light'), tDark: seg(theme === 'dark'),\n      setLight: () => this.setTheme('light'), setDark: () => this.setTheme('dark'),\n      nav: this.go, toast: this.toast, viewState: vs,\n      openNav: () => this.setState({ navOpen: true }), closeNav: () => this.setState({ navOpen: false }),\n      goLanding: () => this.go('landing'), goSettings: () => this.go('settings'),\n      signOut: () => this.go('login'),\n      toasts: this.state.toasts.map(t => ({ ...t, icon: kinds[t.kind][0], color: kinds[t.kind][1], close: () => this.dismiss(t.id) }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
